# Rate-limiting zones (must live in http{} context — include this file from nginx.conf)
# api.sailsouthern.com — three zones:
#   api_zone:       60 req/min per IP  → /api/
#   admin_zone:     10 req/min per IP  → /api/admin/
#   sendit_zone:   120 req/min per IP  → /sendit/  (higher: users click many links)

limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=admin_zone:5m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=sendit_zone:10m rate=120r/m;
