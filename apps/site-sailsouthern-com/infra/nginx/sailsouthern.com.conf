server {
    server_name sailsouthern.com www.sailsouthern.com;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy to Next.js on port 3000
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache Next.js static assets aggressively
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sailsouthern.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sailsouthern.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sailsouthern.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sailsouthern.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name sailsouthern.com www.sailsouthern.com;
    return 404; # managed by Certbot
}
