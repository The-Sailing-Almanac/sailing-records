map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream mastodon-web {
  server 127.0.0.1:3000;
}

upstream mastodon-streaming {
  server 127.0.0.1:4000;
}

server {
  listen 80;
  listen [::]:80;
  server_name social.sailingalmanac.org;
  
  # Redirect HTTP to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name social.sailingalmanac.org;

  # SSL configuration
  ssl_certificate /etc/letsencrypt/live/social.sailingalmanac.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/social.sailingalmanac.org/privkey.pem;

  # Hardened SSL parameters
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Root location proxying to Rails web container
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://mastodon-web;

    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    tcp_nodelay on;
  }

  # Streaming WebSockets proxying to Node container
  location /api/v1/streaming {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://mastodon-streaming;

    proxy_buffering off;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    tcp_nodelay on;
  }

  # Static asset caching rules
  location ~ ^/(emoji|packs|system/accounts/avatars|system/media_attachments/files) {
    proxy_set_header Host $host;
    proxy_pass http://mastodon-web;
    proxy_buffering on;
    proxy_cache_bypass $http_pragma;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Size limits
  client_max_body_size 40m;
}
