[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sailing-records"
version = "1.0.0"
description = "Sailing intelligence and racing records data pipeline"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sailing_records"]
